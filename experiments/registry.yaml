        initial_score: 0.8746376811594203
        final_score: 0.3179710144927536
        forgetting: 0.5566666666666666

    validation:
      dod_validator: "experiments/validate_b0_results.py"
      checks_passed: 8
      total_checks: 8
      status: "PASSED"

