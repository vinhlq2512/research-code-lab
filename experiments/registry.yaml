# Experiment Registry for Continual Relation Extraction
# Defines benchmark runs, baselines, configurations, metrics, and artifact pointers.

experiments:
  - id: "E001"
    title: "Baseline B0: Sequential Fine-Tuning"
    method: "sequential_ft"
    baseline_role: "lower_bound"
    execution_mode: "simulation_mock"
    note: "Initial scaffold verification run using MockRelationClassifier. Pending real BERT training."
    status: "completed_simulation"
    date: "2026-09-27"
    git_commit: "4d648ab79b7f3217b65b98de6065fb8496f2c7e1"
    
    benchmark:
      dataset: "FewRel Track A"
      num_tasks: 8
      relations_per_task: 10
      total_relations: 80
      train_shot: 5
      val_shot: 5
      seed: 2021
      backbone: "bert-base-uncased"
      max_seq_length: 128
      device: "auto"

    purity_boundary:
