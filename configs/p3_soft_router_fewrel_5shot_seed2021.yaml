# ==============================================================================
# P3 — Soft Top-K Prompt Routing & Prompt Composition (TAPTA Minimal)
# Protocol: Protocol v1 Track A (FewRel 8 tasks × 10 relations, 5-shot)
# Architecture: 100% Frozen BERT-base + Soft Top-K Composed Prompt Pool (L=8)
# Memory Setting: M=0 (Rehearsal-Free / Raw-data-free)
# Compute Target: Google Colab (NVIDIA GPU CUDA)
# ==============================================================================

experiment:
  id: "P3"
  name: "p3_soft_router"
  registry_id: "E011"
  baseline_role: "proposed_soft_router"
  description: "Proposed Method P3 (TAPTA Minimal): Frozen BERT with Soft Top-K Weighted Prompt Composition Router and Prompt Orthogonality Regularization (Zero Oracle Task ID)"

dataset:
  name: "fewrel"
  track: "A"
  num_tasks: 8
  relations_per_task: 10
  total_relations: 80
  train_shot: 5
  test_shot: 100
  base_dir: "data/protocol_v1/fewrel"
  split_subdir: "CFRLdata_10_100_10_5"
  task_order_strategy: "conpl_seed_shuffle"

seed: 2021

model:
  backbone: "bert-base-uncased"
  prompt_mode: "routed_pool"
  prompt_length: 8
  max_seq_length: 128
  num_classes: 80
  classifier_dropout: 0.1
  freeze_backbone: true

router:
  type: "centroid"
  subcentroid_weight: 0.7
  top_k: 2
  temperature: 0.2

continual:
  method: "p3_soft_router"
  memory_size: 0
  task_oracle_inference: false
  reference_p0_proto_acc: 0.52825
  reference_p1_proto_acc: 0.701375
  reference_p2a_proto_acc: 0.59275

training:
  learning_rate: 1.0e-3
  weight_decay: 0.01
  batch_size: 16
  epochs_per_task: 15
  warmup_ratio: 0.1
  orthogonality_lambda: 0.05
  optimizer: "AdamW"
  gradient_clip_norm: 1.0
  device: "cuda"

evaluation:
  batch_size: 64
  evaluate_seen_tasks: true
  save_per_task_metrics: true
  primary_metric: "prototype_accuracy"

output:
  results_dir: "runs/p3_soft_router/fewrel_5shot/seed_2021"
  metrics_file: "metrics.json"
  summary_file: "summary.json"
  matrix_csv: "performance_matrix.csv"
  matrix_json: "performance_matrix.json"
  conclusion_file: "conclusion.md"
