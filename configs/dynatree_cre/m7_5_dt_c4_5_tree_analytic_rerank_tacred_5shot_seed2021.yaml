method:
  name: dynatree_cre
  variant: DT-C4.5

prototype:
  encoder: bert-base-uncased
  freeze_encoder: true
  representation_strategy: entity_pair
  normalization: l2
  aggregation: mean
  similarity_space: t1_centered_cosine
  retrieval_similarity_space: raw_cosine
  use_relation_description: true
  description_weight: 0.25
  use_analytic_retrieval: true
  analytic_projection_mode: random_relu
  analytic_projection_dim: 4096
  analytic_projection_seed: 2021
  analytic_ridge_lambda: 10.0
  max_seq_length: 128

tree:
  max_depth: 2
  initial_clustering: agglomerative
  linkage: average
  distance_metric: cosine
  threshold_mode: t1_quantile
  t1_quantile: 0.70
  insertion_threshold: 0.75
  update_policy: insert_or_create
  cluster_weighting: equal_relation
  allow_split: false
  allow_merge: false
  allow_reparenting: false

prompt:
  length: 8
  composition: residual_addition
  init_strategy: normal
  use_root_prompt: true
  use_cluster_prompts: true
  freeze_old_root: true
  freeze_old_clusters: true
  freeze_old_leaves: true

routing:
  strategy: hybrid_analytic_tree
  inference_mode: candidate_rerank
  rerank_fusion_mode: fusion
  rerank_fusion_lambda: 0.5
  rerank_score_norm: zscore
  rerank_forward_chunk_size: 128
  rerank_train_cand_k: 4
  train_mode: inference_consistent
  warmup_epochs: 0
  top_k: 5
  cluster_temperature: 0.2
  relation_temperature: 0.2
  cluster_size_eta: 0.0
  hybrid_cluster_gamma: 0.15
  use_task_id: false
  use_gold_relation: false

classifier:
  type: expandable_cosine
  scale: 20.0
  init_from_prompted_prototype: true
  freeze_old_weights: true
  also_evaluate_ncm: true

memory:
  exemplar_budget: 0
  feature_replay: false
  generative_replay: false
  retain_instance_embeddings: false

loss:
  classification: true
  contrastive: false
  routing_distillation: false
  structure_preservation: false
  parameter_regularization: false

training:
  epochs_per_task: 15
  batch_size: 16
  eval_batch_size: 64
  learning_rate: 5.0e-3
  classifier_lr: 5.0e-3
  weight_decay: 0.01
  warmup_ratio: 0.1
  gradient_clip_norm: 1.0
  device: cuda

experiment:
  experiment_id: M7.5-DT-C4.5-TACRED
  dataset: tacred
  track: A
  task_distribution: standard_random
  base_dir: data/protocol_v1/tacred
  split_subdir: CFRLdata_10_100_10_5
  task_order_strategy: conpl_seed_shuffle
  train_shot: 5
  test_shot: 100
  seed: 2021
  output_dir: runs/dynatree_cre/m7_5_dt_c4_5_tree_analytic/tacred_5shot/seed_2021
