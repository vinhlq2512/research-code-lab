# Frozen BERT + Nearest Prototype (Cosine NCM) Benchmark Configuration
experiment:
  id: "E004"
  name: "frozen_bert_nearest_prototype"
  registry_id: "E004"
  baseline_role: "non_parametric_probing"
  description: "Non-parametric Nearest Prototype baseline with 100% frozen BERT encoder and cosine centroid classification across 8 tasks"

dataset:
  name: "fewrel"
  track: "A"
  num_tasks: 8
  relations_per_task: 10
  total_relations: 80
  train_shot: 5
  val_shot: 5
  max_test_per_relation: null
  raw_data_dir: "dataset-pipelines/continual-relation-extraction/data/raw/fewrel"
  processed_mapping_path: "dataset-pipelines/continual-relation-extraction/data/processed/fewrel/relation_mapping.json"
  task_order_path: "dataset-pipelines/continual-relation-extraction/task-orders/fewrel/order_seed_2021.json"

seed: 2021

model:
  backbone: "bert-base-uncased"
  tokenizer: "bert-base-uncased"
  max_seq_length: 128
  num_classes: 80
  freeze_encoder: true
  freeze_embeddings: true
  classifier_type: "nearest_prototype"
  metric: "cosine"
  mask_unseen_classes: true

continual:
  method: "frozen_bert_nearest_prototype"
  memory_size: 0
  replay: false
  prompt: false
  prototype: true
  static_prototypes: true
  router: false
  knowledge_distillation: false
  ema_teacher: false
  regularization: false

training:
  method: "non_parametric_centroid"
  batch_size: 64
  device: "auto"
  feature_caching: true
  cache_features_path: "data/cache/features_fewrel_seed2021_frozen_bert.pt"

evaluation:
  evaluate_seen_tasks: true
  save_per_task_metrics: true
  primary_metric: "accuracy"
  additional_metrics:
    - "macro_f1"
    - "average_incremental_accuracy"
    - "average_forgetting"
    - "backward_transfer"

output:
  results_dir: "results/fewrel/5shot/Frozen_BERT_nearest_prototype/seed_2021"
  metrics_file: "metrics.jsonl"
  summary_file: "summary.json"
  matrix_csv: "performance_matrix.csv"
  matrix_json: "performance_matrix.json"
  accuracy_plot: "plots/accuracy_over_tasks.png"
  forgetting_plot: "plots/forgetting_curve.png"
  accuracy_plot_svg: "plots/accuracy_over_tasks.svg"
  forgetting_plot_svg: "plots/forgetting_curve.svg"
  checkpoint_dir: "checkpoints"
