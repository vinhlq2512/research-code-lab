# ==============================================================================
# P5 — Contrastive-Margin Tree & Anisotropy-Resistant Router on TACRED Track A
# Protocol: Protocol v1 Track A (TACRED 8 tasks × 5 relations, 5-shot)
# Architecture: 100% Frozen BERT-base + P5 Hierarchical Contrastive Prompt Tree
# Memory Setting: M=0 (Rehearsal-Free / Raw-data-free)
# Inference: Task-Agnostic Confidence-Gated Candidate Masking (Zero Oracle Task ID)
# Compute Target: Google Colab (NVIDIA GPU CUDA) / Local Apple Silicon MPS
# ==============================================================================

experiment:
  id: "P5_TACRED"
  name: "p5_contrastive_tree_tacred"
  registry_id: "E017"
  baseline_role: "proposed_p5_contrastive_tree_tacred"
  description: "Proposed Method P5 on TACRED Track A: Frozen BERT with Whitened Task Router, Rehearsal-Free Supervised Contrastive Prototypes, Confidence-Gated Candidate Masking, and Momentum Root Prompt Anchor"

dataset:
  name: "tacred"
  track: "A"
  num_tasks: 8
  relations_per_task: 5
  total_relations: 41
  train_shot: 5
  test_shot: 100
  base_dir: "data/protocol_v1/tacred"
  split_subdir: "CFRLdata_10_100_10_5"
  task_order_strategy: "conpl_seed_shuffle"

seed: 2021

model:
  backbone: "bert-base-uncased"
  prompt_mode: "p5_hierarchical_tree"
  prompt_length: 8
  root_prompt_length: 4
  leaf_prompt_length: 4
  max_seq_length: 128
  num_classes: 41
  classifier_dropout: 0.1
  freeze_backbone: true
  enable_momentum_root: true
  root_anchor_lambda: 0.1
  proto_contrastive_lambda: 0.2
  proto_contrastive_temp: 0.1

router:
  type: "p5_whitened_router"
  subcentroid_weight: 0.7
  top_k: 2
  enable_whitening: false
  whitening_dim: 32
  whitening_eps: 1.0e-4
  confidence_threshold: 0.05
  temperature: 0.2

continual:
  method: "p5_contrastive_tree"
  memory_size: 0
  task_oracle_inference: false
  reference_p0_proto_acc: 0.380
  reference_p1_proto_acc: 0.580
  reference_p4_acc: 0.4245

training:
  learning_rate: 1.0e-3
  root_lr_multiplier: 0.1
  weight_decay: 0.01
  batch_size: 16
  epochs_per_task: 15
  warmup_ratio: 0.1
  orthogonality_lambda: 0.05
  optimizer: "AdamW"
  gradient_clip_norm: 1.0
  device: "auto"

evaluation:
  batch_size: 64
  evaluate_seen_tasks: true
  save_per_task_metrics: true
  primary_metric: "confidence_gated_accuracy"

output:
  results_dir: "runs/p5_candidates/tacred_5shot/seed_2021"
  metrics_file: "metrics.json"
  summary_file: "summary.json"
  matrix_csv: "performance_matrix.csv"
  matrix_json: "performance_matrix.json"
  conclusion_file: "conclusion.md"
